<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đồng hồ đếm ngược 22/12/2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:linear-gradient(135deg,#123e78,#0b2f63);color:#fff}
.wrap{width:min(1200px,100%);text-align:center}
h1{margin:0 0 22px;font-size:clamp(30px,5vw,58px);line-height:1.05;font-weight:800;letter-spacing:2px;text-shadow:0 2px 5px rgba(0,0,0,.18)}
.target{margin-bottom:24px;font-size:clamp(16px,2vw,24px);color:#dcecff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{padding:28px 15px 23px;border:1px solid rgba(255,255,255,.20);border-radius:20px;background:rgba(255,255,255,.09);box-shadow:0 10px 28px rgba(0,0,0,.12)}
.number{font-size:clamp(52px,7vw,92px);line-height:1;font-weight:800;color:#fff}
.label{margin-top:12px;font-size:17px;letter-spacing:.8px;color:#e2efff}
.tip{margin-top:25px;font-size:15px;color:#d2e3f8}
@media(max-width:700px){
body{padding:18px}
h1{font-size:31px;letter-spacing:1px}
.target{font-size:16px;margin-bottom:18px}
.cards{gap:8px}
.card{padding:20px 5px 17px;border-radius:15px}
.number{font-size:clamp(38px,12vw,58px)}
.label{font-size:11px;margin-top:9px}
.tip{font-size:12px;margin-top:18px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>ĐỒNG HỒ ĐẾM NGƯỢC</h1>
<div class="target">đến <strong>0:00 • 22/12/2026</strong> (giờ Việt Nam)</div>
<div class="cards">
<div class="card"><div class="number" id="days">0</div><div class="label">NGÀY</div></div>
<div class="card"><div class="number" id="hours">00</div><div class="label">GIỜ</div></div>
<div class="card"><div class="number" id="minutes">00</div><div class="label">PHÚT</div></div>
<div class="card"><div class="number" id="seconds">00</div><div class="label">GIÂY</div></div>
</div>
<div class="tip">Mẹo: Ghim đường link này lên đầu nhóm Zalo để mọi người mở là thấy đồng hồ cập nhật theo giây.</div>
</div>
<script>
const target = new Date("2026-12-22T00:00:00+07:00").getTime();
function updateCountdown(){
let diff=Math.max(0,target-Date.now()),total=Math.floor(diff/1000);
document.getElementById("days").textContent=Math.floor(total/86400);
document.getElementById("hours").textContent=String(Math.floor((total%86400)/3600)).padStart(2,"0");
document.getElementById("minutes").textContent=String(Math.floor((total%3600)/60)).padStart(2,"0");
document.getElementById("seconds").textContent=String(total%60).padStart(2,"0");
}
updateCountdown();setInterval(updateCountdown,250);
</script>
</body>
</html>
